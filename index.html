<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recycling Pilot</title>
  <style>
  :root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
min-height: 100vh;
display: grid;
place-items: center;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
background: #0d1117;
color: #e6edf3;
}
main { text-align: center; padding: 2rem; max-width: 40rem; }
.badge {
  display: inline-block;
font-size: 0.75rem;
letter-spacing: 0.08em;
text-transform: uppercase;
padding: 0.35rem 0.7rem;
border: 1px solid #30363d;
border-radius: 999px;
color: #8b949e;
margin-bottom: 1.5rem;
}
h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 1rem; letter-spacing: -0.02em; }
p { color: #8b949e; line-height: 1.6; margin: 0; }
code { background: #161b22; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
</style>
  </head>
  <body>
  <main>
  <span class="badge">Pilot</span>
  <h1>Recycling Pilot</h1>
  <p>This site is live at <code>recycling-pilot.motorq.com</code>, served by GitHub Pages. Content coming soon.</p>
</main>
</body>
</html>
